[project]
name = "amath-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "aiogram>=3.13,<4",
  "apscheduler>=3.10,<4",
  "asyncpg>=0.29,<1",
  "cryptography>=43,<47",
  "httpx>=0.27,<1",
  "pillow>=10.4,<13",
  "pymupdf>=1.24,<2",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amath_bot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
